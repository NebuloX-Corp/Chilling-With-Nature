<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chilling With Nature</title>
<style>
:root{--bg:#f4ecd8;--ink:#4a3b2c;--card:#fffaf0;--acc:#d98e73;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2620;--ink:#efe3cc;--card:#3a332a;--acc:#d98e73;color-scheme:dark}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

.pill,button{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;box-shadow:2px 3px 0 rgba(0,0,0,.18);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:none}
#act{position:fixed;right:16px;max-width:62vw;bottom:calc(40px + env(safe-area-inset-bottom,0px));font-size:24px;padding:18px 34px;min-height:68px;display:none;background:var(--acc);color:#fff}
#tt{position:fixed;left:50%;top:70px;transform:translateX(-50%);max-width:88%;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
#pn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,94vw);max-height:86vh;overflow:auto;background:var(--card);border:2px solid var(--ink);border-radius:28px;padding:18px;box-shadow:4px 6px 0 rgba(0,0,0,.25);display:none}
#pn h2{margin:0 0 8px}#pn h3{margin:12px 0 4px}
.x{position:absolute;right:10px;top:10px;padding:2px 9px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.chips button{padding:4px 9px;font-size:14px}.chips .on{background:var(--acc);color:#fff}
label{display:block;margin:4px 0;font-size:14px}input[type=range]{width:55%;vertical-align:middle}select{font:inherit;background:var(--card);color:var(--ink)}
#cup{width:240px;height:240px;display:block;margin:8px auto;border:2px dashed var(--ink);border-radius:12px;touch-action:none}
small{opacity:.75}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#joy{position:fixed;left:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(74,59,44,.15);border:2px solid var(--ink);touch-action:none;display:none}
@media(pointer:coarse){#joy{display:block}}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(rgba(0,0,0,0) 30%,rgba(60,40,20,.35));opacity:0;pointer-events:none;transition:opacity 1s;text-align:center}#menu h1{margin:0;font-size:clamp(36px,9vw,72px);line-height:1;color:#fffaf0;text-shadow:0 3px 0 #b9697a,0 6px 12px rgba(0,0,0,.3)}#menu p{margin:0 0 8px;color:#fffaf0;text-shadow:0 2px 6px rgba(0,0,0,.4)}#menu.on{opacity:1;pointer-events:auto}#menu button{font-size:20px;padding:10px 30px;min-width:200px}body.mn .hud,body.mn #joy,body.mn #act{display:none!important}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em}
#kn{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:var(--acc);border:2px solid var(--ink);pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div class="pill" id="co">🪙 0</div><div style="display:flex;gap:6px"><button onclick="mapP()">Map</button><button onclick="balloon()">🎈 Balloon</button><button onclick="bag()">🎒 Bag</button></div></div>
<div id="tt" class="pill"></div>
<button id="act" onclick="act()"></button>
<div id="joy"><div id="kn"></div></div>
<div id="menu"><h1>Chilling With<br>Nature</h1><p>a cozy little island 🌼☕🧸</p><button onclick='play()'>▶ Start</button><button onclick='resetSave()'>New game</button></div>
<div id="pn"></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const WW=2400,WH=1500,INK='#6e5340';
const FT={daisy:{n:'Daisy',e:'🌼',c:'#fffdf5',m:'friendship'},lavender:{n:'Lavender',e:'🪻',c:'#a98bd6',m:'calm'},poppy:{n:'Poppy',e:'🌺',c:'#e2574c',m:'love'},wild:{n:'Wildflower',e:'🌸',c:'#f4a259',m:'curiosity'}};
const PL={bear:{n:'Bear',e:'🧸',p:12,c:'#c99a6e'},bunny:{n:'Bunny',e:'🐰',p:12,c:'#f3d6dc'},cat:{n:'Cat',e:'🐱',p:14,c:'#f2c48d'},frog:{n:'Frog',e:'🐸',p:10,c:'#a8d08d'},duck:{n:'Duck',e:'🐥',p:8,c:'#f7e08a'},whale:{n:'Whale',e:'🐳',p:18,c:'#9cc7e0'}};
const DR=[{n:'Latte',p:6,c:'#8b5a3c',s:1,m:2},{n:'Americano',p:5,c:'#4a2f20',s:2,m:0},{n:'Cappuccino',p:6,c:'#7a4e32',s:1,m:2},{n:'Matcha latte',p:7,c:'#8fae5b',s:1,m:2},{n:'Mocha',p:7,c:'#5b3a29',s:1,m:2},{n:'Frappe',p:8,c:'#a0775a',s:1,m:1,i:1},{n:'Espresso',p:4,c:'#3b2418',s:2,m:0},{n:'Flat white',p:6,c:'#9a6a47',s:2,m:1}];
const NP=[
{n:'Mom',x:330,y:770,c:'#e59aa5',say:'Oh sweetheart… this made my whole day 🥹',f:'Mom is smiling at her windowsill flower 🌷'},
{n:'Dad',x:1300,y:715,c:'#7aa0c4',say:'Hah! Well now. Thank you, kiddo.',f:'Dad found a flower on his bench and grinned.'},
{n:'Sweetheart',x:640,y:330,c:'#d9778f',say:'You\'re making me blush!! I love it 💕',f:'Sweetheart found your flower and went pink 💕'},
{n:'Sibling',x:1000,y:350,c:'#8cc9a1',say:'Wait, you got me a flower? …Thanks 🥺',f:'Your sibling pretended not to smile.'},
{n:'Best friend',x:990,y:740,c:'#f0b95c',say:'BFF energy!! I\'m keeping this forever ✨',f:'Your best friend squealed at the flower!'},
{n:'Mail man',x:600,y:520,c:'#6f8fb8',say:'Me? Nobody ever… thank you! *tips cap*',f:'The mail man paused, then tipped his cap to nobody in particular.'}];
const BLD=[[200,170,220,160],[1180,170,220,160],[690,180,220,160],[440,640,220,160]],DOORS=[{x:550,y:822,k:'gear',l:'Enter Gear & Style 🥾'},{x:800,y:360,k:'garden',l:'Enter garden shop 🌷'},{x:310,y:350,k:'cafe',l:'Enter café ☕'},{x:1290,y:350,k:'shop',l:'Enter plushie shop 🧸'}];
let S={coins:5,fl:{daisy:0,lavender:0,poppy:0,wild:0},pl:{},placed:[],gifts:{}};
try{const o=JSON.parse(localStorage.getItem('pmc1'));if(o&&o.fl)S=o}catch(e){}
const save=()=>{try{localStorage.setItem('pmc1',JSON.stringify(S))}catch(e){}};
let seed=7;const R=()=>(seed=seed*16807%2147483647)/2147483647;
/* ---- paper world (drawn once) ---- */
const bg=document.createElement('canvas');bg.width=WW*2;bg.height=WH*2;const b=bg.getContext('2d');b.scale(2,2);
function blob(g,x,y,rx,ry,fill){g.beginPath();for(let i=0;i<=56;i++){const a=i/56*6.283,k=1+(R()-.5)*.018,px=x+Math.cos(a)*rx*k,py=y+Math.sin(a)*ry*k;i?g.lineTo(px,py):g.moveTo(px,py)}g.closePath();g.fillStyle=fill;g.fill();g.stroke()}
function box(g,x,y,w,h,fill){const j=()=>(R()-.5)*1.1;g.beginPath();g.moveTo(x+j(),y+j());g.lineTo(x+w+j(),y+j());g.lineTo(x+w+j(),y+h+j());g.lineTo(x+j(),y+h+j());g.closePath();g.fillStyle=fill;g.fill();g.stroke()}
function txt(g,s,x,y,sz,col){g.fillStyle=col||INK;g.font='italic bold '+sz+'px Georgia,serif';g.textAlign='center';g.fillText(s,x,y)}
(function(){b.fillStyle='#d7e6b8';b.fillRect(0,0,WW,WH);
for(let i=0;i<5000;i++){b.fillStyle='rgba(120,90,50,'+(R()*.12)+')';b.fillRect(R()*WW,R()*WH,1+R()*2,1+R()*2)}
for(let i=0;i<260;i++){b.strokeStyle='rgba(150,120,80,.1)';b.beginPath();const x=R()*WW,y=R()*WH;b.moveTo(x,y);b.lineTo(x+R()*30-15,y+R()*30-15);b.stroke()}
b.lineWidth=2.5;b.strokeStyle=INK;b.lineJoin='round';b.shadowColor='rgba(60,40,20,.28)';b.shadowBlur=6;b.shadowOffsetY=3;
blob(b,WW/2,WH/2+20,1120,690,'#d7e6b8');
b.save();b.shadowColor='transparent';b.strokeStyle='#e9d3a8';b.lineWidth=46;b.lineCap='round';b.lineJoin='round';b.beginPath();b.moveTo(310,345);b.lineTo(310,520);b.lineTo(1290,520);b.lineTo(1290,345);b.moveTo(850,520);b.lineTo(850,640);b.moveTo(800,365);b.lineTo(800,520);b.moveTo(550,520);b.lineTo(550,835);b.stroke();b.restore();
blob(b,850,760,140,80,'#a9d3e0');blob(b,800,745,22,12,'#8fc08a');blob(b,910,780,18,10,'#8fc08a');
blob(b,300,790,95,60,'#c9a77c');for(let i=0;i<14;i++){blob(b,235+(i%7)*21,770+Math.floor(i/7)*34,6,8,'#7fb069')}
box(b,1265,725,70,14,'#a9744f');box(b,1272,739,6,14,'#a9744f');box(b,1322,739,6,14,'#a9744f');
[[60,80],[140,300],[500,120],[700,90],[950,140],[1100,60],[1500,100],[1550,400],[1450,880],[1000,900],[500,900],[120,950],[60,600],[1560,700]].forEach(([x,y])=>{box(b,x-6,y+18,12,30,'#8b6240');blob(b,x,y,36,32,'#8fbf7a');blob(b,x-8,y-8,18,15,'#a8d18f')});
[[200,170,'#f0cdb8','#c96f5a','Café ☕'],[1180,170,'#cfe6d8','#7aa88f','Plushies 🧸'],[690,180,'#f6e3a8','#8fb86a','Garden 🌷'],[440,640,'#e4d3f0','#8c6bb1','Gear & Style 🥾']].forEach(([x,y,w,r,t])=>{box(b,x,y,220,160,w);box(b,x-10,y-22,240,52,r);for(let i=0;i<6;i++)box(b,x+i*37,y+30,18,18,'#fffaf0');box(b,x+85,y+100,50,60,'#7a5238');box(b,x+20,y+75,45,38,'#bfe0ee');box(b,x+155,y+75,45,38,'#bfe0ee');b.shadowColor='transparent';txt(b,t,x+110,y+14,22,'#fffaf0');b.shadowColor='rgba(60,40,20,.28)'});
})();
/* ---- state ---- */
const pl={x:560,y:548,d:1},keys={};let tgt=null,placing=null,cam={x:0,y:0},W,H,z=1,dpr=1,T=0,openP=false,steam=0;
const FL=[],parts=[],items=[],balls=[];
for(let i=0;i<46;i++){let x,y,t=Object.keys(FT)[i%4];do{x=60+R()*1480;y=90+R()*850}while(BLD.some(r=>x>r[0]-30&&x<r[0]+r[2]+30&&y<r[1]+r[3]+60&&y>r[1]-40)||((x-850)/160)**2+((y-760)/100)**2<1);FL.push({t,x,y,on:1,rt:0})}
for(let i=0;i<3;i++)balls.push({x:200+R()*1200,y:R()*WH,t:'daisy',ph:R()*6,col:['#e59aa5','#9cc7e0','#f7e08a'][i],amb:1});
function rs(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;z=Math.min(1.7,Math.max(1.15,W/560))}addEventListener('resize',rs);rs();
const toast=s=>{const t=$('tt');t.innerHTML=emo(s);t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,2600)};
const upd=()=>{$('co').innerHTML=emo('🪙')+' '+S.coins};
const burst=(x,y,e,n=6)=>{for(let i=0;i<n;i++)parts.push({x,y,vx:(R()-.5)*2,vy:-1-R()*1.5,l:60,e})};
/* ---- drawing helpers ---- */
function flower(g,t,x,y,s=1){const f=FT[t];g.lineWidth=2;g.strokeStyle=INK;g.beginPath();g.moveTo(x,y+14*s);g.lineTo(x,y);g.strokeStyle='#5c8f4a';g.stroke();g.strokeStyle=INK;
if(t=='lavender'){for(let i=0;i<4;i++){g.beginPath();g.arc(x+(i%2?3:-3)*s,y-i*4*s+4,3.5*s,0,7);g.fillStyle=f.c;g.fill();g.stroke()}return}
for(let i=0;i<6;i++){const a=i*1.047;g.beginPath();g.arc(x+Math.cos(a)*5*s,y+Math.sin(a)*5*s,4.5*s,0,7);g.fillStyle=f.c;g.fill();g.stroke()}
g.beginPath();g.arc(x,y,3*s,0,7);g.fillStyle=t=='poppy'?'#3b2a2a':'#f2c14e';g.fill()}
function person(g,x,y,coat,name,hat){g.fillStyle='rgba(60,40,20,.2)';g.beginPath();g.ellipse(x,y,14,5,0,0,7);g.fill();g.lineWidth=2.2;g.strokeStyle=INK;g.lineJoin='round';
g.beginPath();g.ellipse(x,y-14,12,15,0,0,7);g.fillStyle=coat;g.fill();g.stroke();
g.beginPath();g.arc(x,y-36,11,0,7);g.fillStyle='#f6d5b5';g.fill();g.stroke();
g.fillStyle=INK;g.beginPath();g.arc(x-4,y-37,1.6,0,7);g.fill();g.beginPath();g.arc(x+4,y-37,1.6,0,7);g.fill();g.beginPath();g.arc(x,y-34,3.5,0.3,2.84);g.stroke();
if(hat){g.beginPath();g.moveTo(x-12,y-41);g.lineTo(x+12,y-41);g.lineTo(x+8,y-53);g.lineTo(x-8,y-53);g.closePath();g.fillStyle=hat;g.fill();g.stroke()}
if(name){g.font='12px Georgia';g.textAlign='center';g.fillStyle=INK;g.fillText(name,x,y+17)}}
function plush(g,k,x,y){const p=PL[k];g.lineWidth=2;g.strokeStyle=INK;g.beginPath();g.arc(x,y,17,0,7);g.fillStyle=p.c;g.fill();g.stroke();g.setLineDash([3,3]);g.beginPath();g.arc(x,y,13,0,7);g.stroke();g.setLineDash([]);g.font='20px serif';g.textAlign='center';g.fillText(p.e,x,y+7)}
/* ---- world interaction ---- */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);let near=null;
function findNear(){near=null;let bd=1e9;
NP.forEach(n=>{const d=dist(pl,n);if(d<60&&d<bd){bd=d;near={k:'npc',o:n,l:'Give a flower to '+n.n+' 💐'}}});
if(!near)DOORS.forEach(o=>{if(dist(pl,o)<50)near={k:o.k,l:o.l}});
if(!near)FL.forEach(f=>{const d=dist(pl,f);if(f.on&&d<38&&d<bd){bd=d;near={k:'fl',o:f,l:'Pick '+FT[f.t].n+' '+FT[f.t].e}}});
const a=$('act');a.style.display=near&&!openP&&!placing?'block':'none';if(near)a.textContent=near.l}
function act(){if(!near||openP)return;if(near.k=='fl'){const f=near.o;f.on=0;f.rt=f.rm=f.p?Math.round(GT()/(1+S.g.h*.5)):2700+Math.floor(Math.random()*1800);pl.pk=1;S.fl[f.t]++;const sd=Math.random()<.2+S.g.p*.1;if(sd)S.seeds[f.t]++;toast(FT[f.t].n+' — it means '+FT[f.t].m+(RARE[f.t]?' (rare!)':'')+(sd?' +1 seed':''));burst(f.x,f.y,'✿');save()}
else if(near.k=='npc')give(near.o.n);else if(near.k=='garden')enter('garden');else if(near.k=='cafe'||near.k=='shop'||near.k=='furn'||near.k=='gear'||near.k=='cosm')enter(near.k);else if(near.k=='home')enterHome();else if(near.k=='gitem')gbuy(near.o.key);else if(near.k=='sitem')sbuy(near.o.key);else if(near.k=='keeper')({gear:gear,garden:gshop,cosm:()=>cosmP('head')}[scene])();else if(near.k=='zone')cosmP(near.o.key);else if(near.k=='hup')hup();else if(near.k=='exit')leave();else if(near.k=='bar')bar();else if(near.k=='sit')sit();else if(near.k=='pick')pickP(near.o.key);else if(near.k=='pay')pay();else if(near.k=='shop')shop()}
addEventListener('keydown',e=>{if(['e','E',' ','Enter'].includes(e.key)&&!e.repeat&&document.activeElement.tagName!='BUTTON'){e.preventDefault();act()}keys[e.key.toLowerCase()]=1;tgt=null});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('pointerdown',e=>{const x=e.clientX/z+cam.x,y=e.clientY/z+cam.y;
if(placing){S.pl[placing]--;S.placed.push({k:placing,x,y});toast('Placed '+PL[placing].n+' 🧸 (tap it again to pick up)');placing=null;save();return}
const i=S.placed.findIndex(p=>Math.hypot(p.x-x,p.y-y)<22);if(i>=0){const p=S.placed.splice(i,1)[0];S.pl[p.k]=(S.pl[p.k]||0)+1;toast('Back in your bag');save();return}
});
/* ---- panels ---- */
const pn=$('pn');
function P(h){pn.innerHTML='<button class="x" onclick="cl()">✕</button>'+h;pn.style.display='block';openP=true;$('act').style.display='none';$('joy').style.visibility='hidden'}
function cl(){pn.style.display='none';openP=!!mode;$('joy').style.visibility='visible';steam=0;tgt=null}
function bag(){let h='<h2>🎒 Bag</h2><p>🪙 '+S.coins+' flower coins · sell flowers at the Garden Shop</p>';
for(const t in FT)h+=`<div class="r"><span>${FT[t].e} ${FT[t].n} ×${S.fl[t]} <small>(${FT[t].m})</small></span></div>`;
h+='<h3>Plushies</h3>';let n=0;for(const k in PL)if(S.pl[k]>0){n=1;h+=`<div class="r"><span>${PL[k].e} ${PL[k].n} ×${S.pl[k]}</span><button onclick="plc('${k}')">Place</button></div>`}
if(!n)h+='<small>None yet — visit the plushie shop!</small>';P(h)}
const GP={daisy:3,lavender:3,poppy:4,wild:5};
function gshop(){let h='<h2>🌷 Garden Shop</h2><p>🪙 '+S.coins+' · The gardener buys your flowers.</p>',a=0;for(const t in FT){const n=S.fl[t];if(n>0)a=1;h+=`<div class="r"><span>${FT[t].e} ${FT[t].n} ×${n}<br><small>🪙${GP[t]} each</small></span><span><button onclick="sell('${t}',1)">Sell 1</button> <button onclick="sell('${t}',${n})">All</button></span></div>`}if(!a)h+='<p><small>Go pick some flowers first 🌼</small></p>';P(h)}
function sell(t,n){n=Math.min(n,S.fl[t]);if(n>0){S.fl[t]-=n;S.coins+=Math.round(n*GP[t]*(1+S.g.k*.1));upd();save();toast('Sold for 🪙'+n*GP[t]);gshop()}}
function plc(k){cl();placing=k;toast('Tap anywhere to place your '+PL[k].n)}
function shop(){let h='<h2>🧸 Plushie Shop</h2><p>🪙 '+S.coins+'</p>';for(const k in PL)h+=`<div class="r"><span>${PL[k].e} ${PL[k].n} <small>🪙${PL[k].p}</small></span><button onclick="buy('${k}')">Buy</button></div>`;P(h+'<small>Place them anywhere from your Bag.</small>')}
function buy(k){if(S.coins<PL[k].p){toast('Not enough coins — sell some flowers!');return}S.coins-=PL[k].p;S.pl[k]=(S.pl[k]||0)+1;upd();save();shop();toast(PL[k].e+' is in your bag!')}
function give(n){const p=NP.find(x=>x.n==n);let h=`<h2>For ${n} 💐</h2>`,a=0;for(const t in FT)if(S.fl[t]>0){a=1;h+=`<div class="r"><span>${FT[t].e} ${FT[t].n} ×${S.fl[t]}<br><small>${FT[t].m}</small></span><span><button onclick="gv('${n}','${t}',0)">Hand over</button> <button onclick="gv('${n}','${t}',1)">Leave nearby</button></span></div>`}
if(!a)h+='<p>Pick a flower first 🌼</p>';P(h+(S.gifts[n]?`<small>You've given ${n} ${S.gifts[n]} flower(s) ♥</small>`:''))}
function gv(n,t,leave){const p=NP.find(x=>x.n==n);S.fl[t]--;S.gifts[n]=(S.gifts[n]||0)+1;cl();save();
if(leave){items.push({t,x:p.x+26,y:p.y+4});toast('You tucked it where '+n+' will see it…');setTimeout(()=>{p.bub=[p.f,260];burst(p.x,p.y-62,'💗')},3000)}
else{p.bub=[p.say,260];burst(p.x,p.y-62,'💗',9)}}
